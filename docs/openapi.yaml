openapi: 3.0.3
info:
  title: self-dojo-backend API
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Auth
  - name: User
  - name: Profile
  - name: Academies
  - name: Membership
  - name: Students
  - name: ClassSchedules
  - name: Modalities
paths:
  /ping:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Pong response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
              example:
                message: pong

  /auth/register:
    post:
      tags: [Auth]
      summary: Register account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              example:
                value:
                  username: meu_usuario
                  email: user@example.com
                  password: minimo-8-caracteres
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email or username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Retorna sucesso; o cliente deve descartar o token (JWT é stateless).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logged out
        "401":
          description: Token ausente ou inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Solicitar reset de senha
      description: Gera um token de reset e retorna (em dev). Em produção, enviaria por email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: Token gerado (em dev retorna o token; em produção apenas confirma)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                    description: Apenas em desenvolvimento - remover em produção
                  expires_at:
                    type: string
                    format: date-time
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Resetar senha com token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
              required: [token, password]
      responses:
        "200":
          description: Senha resetada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: password reset successfully
        "400":
          description: Token inválido, expirado ou já usado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      tags: [User]
      summary: Current user (perfil do usuário autenticado)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dados do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  email:
                    type: string
                    format: email
                required: [id, username, email]
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/me:
    get:
      tags: [Profile]
      summary: Current user profile (mobile)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dados completos do usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Profile]
      summary: Update current user profile (mobile)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/me/avatar:
    post:
      tags: [Profile]
      summary: Upload avatar for authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadResponse"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Storage provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies:
    get:
      tags: [Academies]
      summary: List academies owned by authenticated user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: owner
          schema:
            type: string
            enum: [me]
          required: true
      responses:
        "200":
          description: Academy list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AcademyResponse"
                required: [items]
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Academies]
      summary: Create academy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcademyRequest"
      responses:
        "201":
          description: Academy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademyResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/search:
    get:
      tags: [Academies]
      summary: Search academies by query/city/modality
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: city
          schema:
            type: string
        - in: query
          name: modality
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AcademyResponse"
                required: [items]
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/{academyId}:
    get:
      tags: [Academies]
      summary: Get academy details
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
      responses:
        "200":
          description: Academy detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademyResponse"
        "400":
          description: Invalid academy id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Academy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Academies]
      summary: Update academy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAcademyRequest"
      responses:
        "200":
          description: Academy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademyResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Academy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/{academyId}/stats:
    get:
      tags: [Academies]
      summary: Get academy stats
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
      responses:
        "200":
          description: Academy stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademyStatsResponse"
        "400":
          description: Invalid academy id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Academy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/{academyId}/membership/me:
    get:
      tags: [Membership]
      summary: Get membership status for authenticated user in academy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
      responses:
        "200":
          description: Membership status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipStatusResponse"
        "400":
          description: Invalid academy id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/{academyId}/membership-requests:
    get:
      tags: [Membership]
      summary: List membership requests for academy (owner only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, suspended, cancelled]
      responses:
        "200":
          description: Membership request list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AcademyMemberResponse"
                required: [items]
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Academy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Membership]
      summary: Create membership request for authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
      responses:
        "201":
          description: Membership request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademyMemberResponse"
        "404":
          description: Academy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Membership already pending or approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/{academyId}/membership-requests/me:
    delete:
      tags: [Membership]
      summary: Cancel pending membership request for authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
      responses:
        "204":
          description: Membership request cancelled
        "404":
          description: Pending membership request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/{academyId}/membership-requests/{memberId}/approve:
    post:
      tags: [Membership]
      summary: Approve membership request (owner only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
        - $ref: "#/components/parameters/MemberIdParam"
      responses:
        "200":
          description: Membership request approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademyMemberResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Academy or membership request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/{academyId}/membership-requests/{memberId}/reject:
    post:
      tags: [Membership]
      summary: Reject membership request (owner only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
        - $ref: "#/components/parameters/MemberIdParam"
      responses:
        "204":
          description: Membership request rejected
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Academy or membership request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/{academyId}/students:
    get:
      tags: [Students]
      summary: List approved students in academy (owner only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
      responses:
        "200":
          description: Student list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AcademyStudentResponse"
                required: [items]
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Academy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/{academyId}/students/{memberId}:
    get:
      tags: [Students]
      summary: Get student details by member id (owner only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
        - $ref: "#/components/parameters/MemberIdParam"
      responses:
        "200":
          description: Student detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademyStudentResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Academy or student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/{academyId}/students/{memberId}/modalities:
    post:
      tags: [Students]
      summary: Enroll student in academy modality
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
        - $ref: "#/components/parameters/MemberIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollStudentRequest"
      responses:
        "201":
          description: Student enrolled in modality
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentModalityResponse"
        "404":
          description: Academy, student, or modality not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Student already enrolled in modality
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/{academyId}/students/{memberId}/modalities/{studentModalityId}:
    patch:
      tags: [Students]
      summary: Update student modality fields
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
        - $ref: "#/components/parameters/MemberIdParam"
        - $ref: "#/components/parameters/StudentModalityIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentModalityRequest"
      responses:
        "200":
          description: Student modality updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentModalityResponse"
        "404":
          description: Student modality not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Students]
      summary: Remove student from modality
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyIdParam"
        - $ref: "#/components/parameters/MemberIdParam"
        - $ref: "#/components/parameters/StudentModalityIdParam"
      responses:
        "204":
          description: Enrollment removed
        "404":
          description: Student modality not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/student-modalities/{studentModalityId}/promotions:
    post:
      tags: [Students]
      summary: Promote student in modality (owner only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentModalityIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteStudentRequest"
      responses:
        "200":
          description: Student promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentModalityResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student modality not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/student-modalities/{studentModalityId}/graduation-history:
    get:
      tags: [Students]
      summary: List graduation history by student modality
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentModalityIdParam"
      responses:
        "200":
          description: Graduation history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraduationHistoryResponse"
                required: [items]
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student modality not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/check-ins:
    post:
      tags: [Students]
      summary: Register check-in and increment student class counters
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckInRequest"
      responses:
        "201":
          description: Check-in created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student modality not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/me/check-ins:
    post:
      tags: [Students]
      summary: Register check-in for authenticated user (auto-resolving student modality)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMyCheckInRequest"
      responses:
        "201":
          description: Check-in created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResponse"
        "400":
          description: Invalid request or student not enrolled in modality
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Class schedule or student modality not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/student-modalities/{studentModalityId}/check-ins:
    get:
      tags: [Students]
      summary: List check-ins for student modality
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentModalityIdParam"
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Check-in list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CheckInResponse"
                required: [items]
        "400":
          description: Invalid dates format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student modality not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/academies/{academyId}/class-schedules:
    get:
      tags: [ClassSchedules]
      summary: List class schedules by academy
      security:
        - bearerAuth: []
