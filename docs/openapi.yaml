      properties:
        assigned_teacher_id:
          type: string
          format: uuid
        total_classes:
          type: integer
        classes_at_current_belt:
          type: integer
    PromoteStudentRequest:
      type: object
      properties:
        new_belt_id:
          type: string
        degree:
          type: integer
        notes:
          type: string
      required: [new_belt_id]
    CreateCheckInRequest:
