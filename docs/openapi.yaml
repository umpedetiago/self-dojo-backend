    AcademyStudentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        academy_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
        status:
          type: string
        joined_at:
          type: string
          format: date-time
        user:
