components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AcademyIdParam:
      in: path
      name: academyId
      required: true
      schema:
        type: string
        format: uuid
    ModalityIdParam:
      in: path
      name: modalityId
      required: true
      schema:
        type: string
        format: uuid
    MemberIdParam:
      in: path
      name: memberId
      required: true
      schema:
        type: string
        format: uuid
    StudentModalityIdParam:
      in: path
      name: studentModalityId
      required: true
      schema:
        type: string
        format: uuid
    ScheduleIdParam:
      in: path
      name: scheduleId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [username, email, password]
    AuthRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        photo_url:
          type: string
          format: uri
        role:
          type: string
        martial_art_type:
          type: string
        belt_id:
          type: string
        degree:
          type: integer
        total_classes:
          type: integer
        has_aparadores:
          type: boolean
        primary_student_modality_id:
          type: string
          format: uuid
          description: ID da modalidade principal (student_modalities) usada como fonte para os campos top-level.
        student_modalities:
          type: array
          description: Modalidades em que o usuário está matriculado (fonte principal de graduação/progresso no mobile).
          items:
            $ref: "#/components/schemas/StudentModalityResponse"
        academy_id:
          type: string
          format: uuid
          description: Conveniência — academy_id derivado da membership do aluno (se existir).
        academy_status:
          type: string
          description: Conveniência — status da membership do aluno (pending/approved/etc).
        joined_at:
          type: string
          format: date-time
          description: Conveniência — data de entrada na academia (se existir).
        createdAt:
          type: string
          format: date-time
      required: [id, username, email, createdAt]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required: [error]
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        display_name:
          type: string
        photo_url:
          type: string
          format: uri
        role:
          type: string
        martial_art_type:
          type: string
    UserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]
    AvatarUploadResponse:
      type: object
      properties:
        photo_url:
          type: string
          format: uri
        user:
          $ref: "#/components/schemas/User"
      required: [photo_url, user]
    CreateAcademyRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
          format: uri
        modalities:
          type: array
          items:
            type: string
      required: [name, modalities]
    UpdateAcademyRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        description:
          type: string
        logo_url:
          type: string
          format: uri
        address:
          type: string
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
          format: uri
        is_active:
          type: boolean
    AcademyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        logo_url:
          type: string
          format: uri
        address:
          type: string
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
          format: uri
        subscription_plan:
          type: string
        subscription_started_at:
          type: string
          format: date-time
        subscription_ends_at:
          type: string
          format: date-time
        max_students:
          type: integer
        max_teachers:
          type: integer
        max_modalities:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        academy_modalities:
          type: array
          items:
            $ref: "#/components/schemas/AcademyModalityResponse"
      required: [id, owner_id, name]
    AcademyStatsResponse:
      type: object
      properties:
        approved_members:
          type: integer
        pending_requests:
          type: integer
      required: [approved_members, pending_requests]
    MembershipStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [none, pending, approved, suspended, cancelled]
      required: [status]
    AcademyMemberResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        academy_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
        status:
          type: string
        joined_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user:
          type: object
          properties:
            email:
              type: string
              format: email
            display_name:
              type: string
            photo_url:
              type: string
              format: uri
      required: [id, academy_id, user_id, role, status]
    EnrollStudentRequest:
      type: object
      properties:
        academy_modality_id:
          type: string
          format: uuid
        initial_belt_id:
          type: string
        initial_degree:
          type: integer
      required: [academy_modality_id, initial_belt_id]
    UpdateStudentModalityRequest:
      type: object
