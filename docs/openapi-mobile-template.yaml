openapi: 3.0.3
info:
  title: self-dojo-backend Mobile Migration API (Template)
  version: 1.0.0-draft
servers:
  - url: http://localhost:8080
tags:
  - name: Profile
  - name: Academies
  - name: Modalities
  - name: Membership
  - name: Students
  - name: Graduation
  - name: CheckIns
  - name: ClassSchedules
paths:
  /v1/me:
    get:
      tags: [Profile]
      summary: Get authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Profile]
      summary: Update authenticated user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/me/avatar:
    post:
      tags: [Profile]
      summary: Upload avatar for authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo_url:
                    type: string
                    format: uri
                required: [photo_url]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/academies:
    get:
      tags: [Academies]
      summary: List academies owned by authenticated user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: owner
          schema:
            type: string
            enum: [me]
      responses:
        "200":
          description: Academy list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Academy"
                required: [items]
    post:
      tags: [Academies]
      summary: Create academy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcademyRequest"
      responses:
        "201":
          description: Academy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Academy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/academies/search:
    get:
      tags: [Academies]
      summary: Search academies by query/city/modality
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: city
          schema:
            type: string
        - in: query
          name: modality
          schema:
            $ref: "#/components/schemas/MartialArtType"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AcademySearchItem"
                required: [items]

  /v1/academies/{academyId}:
    get:
      tags: [Academies]
      summary: Get academy details
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
      responses:
        "200":
          description: Academy detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Academy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Academies]
      summary: Update academy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAcademyRequest"
      responses:
        "200":
          description: Academy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Academy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/academies/{academyId}/stats:
    get:
      tags: [Academies]
      summary: Get academy stats
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved_members:
                    type: integer
                  pending_requests:
                    type: integer
                required: [approved_members, pending_requests]

  /v1/academies/{academyId}/membership/me:
    get:
      tags: [Membership]
      summary: Get my membership status in academy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
      responses:
        "200":
          description: Membership status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [none, pending, approved, rejected, suspended, cancelled]
                required: [status]

  /v1/academies/{academyId}/membership-requests:
    get:
      tags: [Membership]
      summary: List membership requests
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Request list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AcademyMember"
                required: [items]
    post:
      tags: [Membership]
      summary: Create membership request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
      requestBody:
        required: false
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademyMember"

  /v1/academies/{academyId}/membership-requests/me:
    delete:
      tags: [Membership]
      summary: Cancel my pending membership request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
      responses:
        "204":
          description: Cancelled

  /v1/academies/{academyId}/membership-requests/{memberId}/approve:
    post:
      tags: [Membership]
      summary: Approve membership request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademyMember"

  /v1/academies/{academyId}/membership-requests/{memberId}/reject:
    post:
      tags: [Membership]
      summary: Reject membership request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademyMember"

  /v1/academies/{academyId}/students:
    get:
      tags: [Students]
      summary: List students in academy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
      responses:
        "200":
          description: Student list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AcademyMember"
                required: [items]

  /v1/academies/{academyId}/students/{memberId}:
    get:
      tags: [Students]
      summary: Get student details
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Student detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademyMember"

  /v1/academies/{academyId}/students/{memberId}/modalities:
    post:
      tags: [Students]
      summary: Enroll student in modality
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollStudentRequest"
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentModality"

  /v1/academies/{academyId}/students/{memberId}/modalities/{studentModalityId}:
    patch:
      tags: [Students]
      summary: Update student modality
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
        - $ref: "#/components/parameters/MemberId"
        - $ref: "#/components/parameters/StudentModalityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentModalityRequest"
      responses:
        "200":
          description: Student modality updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentModality"
    delete:
      tags: [Students]
      summary: Unenroll student modality
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
        - $ref: "#/components/parameters/MemberId"
        - $ref: "#/components/parameters/StudentModalityId"
      responses:
        "204":
          description: Enrollment removed

  /v1/student-modalities/{studentModalityId}/promotions:
    post:
      tags: [Graduation]
      summary: Promote student in modality
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentModalityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteStudentRequest"
      responses:
        "200":
          description: Promotion applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentModality"

  /v1/student-modalities/{studentModalityId}/graduation-history:
    get:
      tags: [Graduation]
      summary: List graduation history by student modality
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentModalityId"
      responses:
        "200":
          description: Graduation history list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraduationHistory"
                required: [items]

  /v1/check-ins:
    post:
      tags: [CheckIns]
      summary: Register check-in
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckInRequest"
      responses:
        "201":
          description: Check-in created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"

  /v1/me/check-ins:
    post:
      tags: [CheckIns]
      summary: Register check-in for authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMyCheckInRequest"
      responses:
        "201":
          description: Check-in created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"

  /v1/student-modalities/{studentModalityId}/check-ins:
    get:
      tags: [CheckIns]
      summary: List check-ins by student modality
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentModalityId"
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Check-in list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CheckIn"
                required: [items]

  /v1/academies/{academyId}/class-schedules:
    get:
      tags: [ClassSchedules]
      summary: List class schedules
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
        - in: query
          name: modalityId
          schema:
            type: string
            format: uuid
        - in: query
          name: dayOfWeek
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        "200":
          description: Schedule list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClassSchedule"
                required: [items]
    post:
      tags: [ClassSchedules]
      summary: Create class schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassScheduleRequest"
      responses:
        "201":
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassSchedule"

  /v1/academies/{academyId}/class-schedules/{scheduleId}:
    get:
      tags: [ClassSchedules]
      summary: Get class schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "200":
          description: Schedule details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassSchedule"
    patch:
      tags: [ClassSchedules]
      summary: Update class schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
        - $ref: "#/components/parameters/ScheduleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassScheduleRequest"
      responses:
        "200":
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassSchedule"
    delete:
      tags: [ClassSchedules]
      summary: Delete class schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "204":
          description: Schedule deleted

  /v1/academies/{academyId}/class-schedules/available-for-checkin:
    get:
      tags: [ClassSchedules]
      summary: List active schedules available for check-in today
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcademyId"
      responses:
        "200":
          description: Available schedule list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClassSchedule"
                required: [items]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AcademyId:
      in: path
      name: academyId
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      in: path
      name: memberId
      required: true
      schema:
        type: string
        format: uuid
    StudentModalityId:
      in: path
      name: studentModalityId
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      in: path
      name: scheduleId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required: [error]
    MartialArtType:
      type: string
      enum: [jiuJitsu, jiuJitsuKids, judo, karate, muayThai, boxe, taekwondo, mma, kickboxing]
    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        photo_url:
          type: string
          format: uri
        role:
          type: string
        martial_art_type:
          $ref: "#/components/schemas/MartialArtType"
        belt_id:
          type: string
        degree:
          type: integer
        total_classes:
          type: integer
        has_aparadores:
          type: boolean
        primary_student_modality_id:
          type: string
          format: uuid
        student_modalities:
          type: array
          items:
            $ref: "#/components/schemas/StudentModality"
        academy_id:
          type: string
          format: uuid
        academy_status:
          type: string
        joined_at:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        # TODO: adicionar campo "graduation_history" (array) com o histórico
        # de graduações do aluno quando estiver disponível na API.
      required: [id, username, email, createdAt]
    UpdateMeRequest:
      type: object
      properties:
        display_name:
          type: string
        role:
          type: string
        martial_art_type:
          $ref: "#/components/schemas/MartialArtType"
    CreateAcademyRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        modalities:
          type: array
          items:
            $ref: "#/components/schemas/MartialArtType"
      required: [name, modalities]
    UpdateAcademyRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        logo_url:
          type: string
          format: uri
        address:
          type: string
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
          format: uri
        is_active:
          type: boolean
    AcademySearchItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        state:
          type: string
        logo_url:
          type: string
          format: uri
        modalities:
          type: array
          items:
            $ref: "#/components/schemas/MartialArtType"
      required: [id, name]
    Academy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        logo_url:
          type: string
          format: uri
        city:
          type: string
        state:
          type: string
        is_active:
          type: boolean
        academy_modalities:
          type: array
          items:
            $ref: "#/components/schemas/AcademyModality"
      required: [id, owner_id, name]
    AcademyModality:
      type: object
      properties:
        id:
          type: string
          format: uuid
        academy_id:
          type: string
          format: uuid
        martial_art_type:
          $ref: "#/components/schemas/MartialArtType"
        master_id:
          type: string
          format: uuid
          nullable: true
        use_default_graduation:
          type: boolean
        is_active:
          type: boolean
      required: [id, academy_id, martial_art_type]
    AcademyMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        academy_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
        status:
          type: string
        joined_at:
          type: string
          format: date-time
      required: [id, academy_id, user_id, role, status]
    EnrollStudentRequest:
      type: object
      properties:
        academy_modality_id:
          type: string
          format: uuid
        initial_belt_id:
          type: string
        initial_degree:
          type: integer
          default: 0
      required: [academy_modality_id, initial_belt_id]
    UpdateStudentModalityRequest:
      type: object
      properties:
        assigned_teacher_id:
          type: string
          format: uuid
        total_classes:
          type: integer
        classes_at_current_belt:
          type: integer
    StudentModality:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        modality_id:
          type: string
          format: uuid
        belt_id:
          type: string
        degree:
          type: integer
        total_classes:
          type: integer
        classes_at_current_belt:
          type: integer
      required: [id, member_id, modality_id, belt_id]
    PromoteStudentRequest:
      type: object
      properties:
        new_belt_id:
          type: string
        degree:
          type: integer
          default: 0
        notes:
          type: string
      required: [new_belt_id]
    GraduationHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        student_modality_id:
          type: string
          format: uuid
        belt_id:
          type: string
        degree:
          type: integer
        promoted_at:
          type: string
          format: date-time
      required: [id, student_modality_id, belt_id, promoted_at]
    CreateCheckInRequest:
      type: object
      properties:
        student_modality_id:
          type: string
          format: uuid
        class_schedule_id:
          type: string
          format: uuid
          nullable: true
        class_type:
          type: string
        notes:
          type: string
      required: [student_modality_id]
    CreateMyCheckInRequest:
      type: object
      properties:
        class_schedule_id:
          type: string
          format: uuid
        class_type:
          type: string
        notes:
          type: string
      required: [class_schedule_id]
    CheckIn:
      type: object
      properties:
        id:
          type: string
          format: uuid
        student_modality_id:
          type: string
          format: uuid
        class_schedule_id:
          type: string
          format: uuid
          nullable: true
        checked_in_at:
          type: string
          format: date-time
      required: [id, student_modality_id, checked_in_at]
    CreateClassScheduleRequest:
      type: object
      properties:
        modality_id:
          type: string
          format: uuid
          nullable: true
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        days_of_week:
          type: array
          items:
